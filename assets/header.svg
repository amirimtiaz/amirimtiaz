<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Amir Imtiaz — AI-Native Technical Builder, Systems Problem Solver, Product Thinker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset=".52" stop-color="#0b1739"/>
      <stop offset="1" stop-color="#241052"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#67e8f9" stop-opacity=".8"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#64748b" stroke-opacity=".11"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#67e8f9" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1040" cy="72" r="180" fill="#7c3aed" opacity=".13" filter="url(#blur)"/>
  <circle cx="80" cy="320" r="160" fill="#0891b2" opacity=".12" filter="url(#blur)"/>
  <path d="M0 294 C210 245 333 342 534 289 S872 222 1200 287" fill="none" stroke="url(#line)" stroke-width="2" opacity=".38"/>
  <g opacity=".72" stroke="#67e8f9" stroke-width="1.4">
    <path d="M930 72L1015 128L1102 74L1068 180L1134 244L1023 230L944 282L955 179Z" fill="none"/>
    <circle cx="930" cy="72" r="6" fill="#22d3ee"/><circle cx="1015" cy="128" r="7" fill="#818cf8"/>
    <circle cx="1102" cy="74" r="5" fill="#c084fc"/><circle cx="1068" cy="180" r="8" fill="#22d3ee"/>
    <circle cx="1134" cy="244" r="5" fill="#818cf8"/><circle cx="1023" cy="230" r="7" fill="#c084fc"/>
    <circle cx="944" cy="282" r="5" fill="#22d3ee"/><circle cx="955" cy="179" r="6" fill="#818cf8"/>
  </g>
  <circle cx="1068" cy="180" r="42" fill="url(#glow)" opacity=".55">
    <animate attributeName="r" values="34;54;34" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".32;.7;.32" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <text x="72" y="78" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4">HELLO, WORLD — I'M</text>
  <text x="68" y="158" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-2">AMIR IMTIAZ</text>
  <rect x="72" y="182" width="690" height="2" rx="1" fill="url(#line)"/>
  <text x="72" y="224" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">AI-Native Technical Builder</text>
  <circle cx="340" cy="218" r="3" fill="#67e8f9"/>
  <text x="355" y="224" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Systems Problem Solver</text>
  <circle cx="612" cy="218" r="3" fill="#a78bfa"/>
  <text x="627" y="224" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Product Thinker</text>
  <text x="72" y="273" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">PRODUCT × DATA × AI × ENGINEERING</text>
  <rect x="72" y="302" width="11" height="11" rx="2" fill="#22d3ee" filter="url(#shadow)">
    <animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <text x="94" y="312" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">BUILDING SYSTEMS THAT TURN SIGNAL INTO IMPACT</text>
</svg>