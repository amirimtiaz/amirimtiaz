<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Animated builder operating system: Discover, Decode, Design, Deliver">
<defs>
 <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
 <linearGradient id="path" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#34d399"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="300" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="#334155"/>
<text x="600" y="43" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">THE BUILDER QUEST</text>
<text x="600" y="67" text-anchor="middle" fill="#64748b" font-family="ui-monospace,monospace" font-size="12" letter-spacing="2">FROM AMBIGUITY TO IMPACT</text>
<path d="M130 165 C250 80 345 245 470 165 S700 80 805 165 S1000 242 1080 165" fill="none" stroke="#1e293b" stroke-width="16" stroke-linecap="round"/>
<path id="route" d="M130 165 C250 80 345 245 470 165 S700 80 805 165 S1000 242 1080 165" fill="none" stroke="url(#path)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
 <g transform="translate(130 165)"><circle r="34" fill="#0f2942" stroke="#38bdf8" stroke-width="2"/><text y="5" font-size="22">🔎</text><text y="57" fill="#e2e8f0" font-size="16" font-weight="700">DISCOVER</text><text y="76" fill="#64748b" font-size="11">FIND THE REAL NEED</text></g>
 <g transform="translate(470 165)"><circle r="34" fill="#211d46" stroke="#818cf8" stroke-width="2"/><text y="5" font-size="22">📊</text><text y="57" fill="#e2e8f0" font-size="16" font-weight="700">DECODE</text><text y="76" fill="#64748b" font-size="11">SEPARATE SIGNAL</text></g>
 <g transform="translate(805 165)"><circle r="34" fill="#271b43" stroke="#a78bfa" stroke-width="2"/><text y="5" font-size="22">🧩</text><text y="57" fill="#e2e8f0" font-size="16" font-weight="700">DESIGN</text><text y="76" fill="#64748b" font-size="11">BUILD THE SYSTEM</text></g>
 <g transform="translate(1080 165)"><circle r="34" fill="#0d3029" stroke="#34d399" stroke-width="2"/><text y="5" font-size="22">🚀</text><text y="57" fill="#e2e8f0" font-size="16" font-weight="700">DELIVER</text><text y="76" fill="#64748b" font-size="11">CREATE THE IMPACT</text></g>
</g>
<g filter="url(#glow)">
 <circle r="10" fill="#f8fafc" stroke="#38bdf8" stroke-width="4">
  <animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion>
 </circle>
 <circle r="3" fill="#0f172a"><animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>
</g>
</svg>